
name: Keep Kevin Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Kevin health endpoint
        run: |
          curl --fail --show-error --silent \
            --max-time 120 \
            https://cyber-glitch-gamer.onrender.com/health
